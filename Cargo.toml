[package]
name = "treenode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "A simple Node struct"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/treenode"
repository = "https://github.com/DenisGorbachev/treenode"
readme = "README.md"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "lefthook.yml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[package.metadata.details]
title = "A simple Node struct"
tagline = ""
summary = ""
announcement = ""

[dependencies]
derive-new = "0.7.0"
derive_builder = "0.20.0"
derive_setters = { version = "0.1.0" }
serde = { version = "1.0.0", features = ["derive"], optional = true }
